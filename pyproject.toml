[project]
name = "vyntrava-data-studio"
version = "0.1.0"
description = "Motor local de procesamiento de datos mediante recetas versionadas y entregas verificables"
authors = [
    { name = "johanseb15", email = "johanseb15@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.11.2",
    "openpyxl==3.1.5",
    "pandas==3.1.0",
    "pillow==13.0.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
